# CI stage order per docs/testing/architecture-fitness-functions.md section 5.
# Scaffold skeleton: runs what exists now (pure-package analyze/test + FF-ARCH-01).
# P01 fills in the remaining stages (integration + behavioral FFs + golden
# scenarios, migration/sync, Windows+Android builds).
name: ci
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
      - name: Foundation analyze + test
        working-directory: packages/foundation
        run: |
          dart pub get
          dart analyze
          dart test
      - name: Time Kernel analyze + test (DST, schedules; GS-04)
        working-directory: packages/time_kernel
        run: |
          dart pub get
          dart analyze
          dart test
      - name: Domain analyze + test (Task rules, hierarchy, transitions)
        working-directory: packages/domain
        run: |
          dart pub get
          dart analyze
          dart test
      - name: Application analyze + test (command gateway contract)
        working-directory: packages/application
        run: |
          dart pub get
          dart analyze
          dart test
      - name: Infrastructure analyze + test (Drift store, FTS, governance kernel)
        working-directory: packages/infrastructure
        run: |
          dart pub get
          dart run build_runner build
          dart analyze
          dart test
      - name: FF-ARCH-01 (pure domain import scan)
        run: dart run tools/fitness/ff_arch_01_pure_domain.dart
      - name: FF-ARCH-04 (ui depends on application ports only)
        run: dart run tools/fitness/ff_arch_04_ui_isolation.dart
      - name: FF-ARCH-06 + FF-ARCH-09 (atomic set per handler; authorize before domain)
        run: dart run tools/fitness/ff_arch_06_09.dart

  flutter-ui-and-app:
    runs-on: ubuntu-latest
    needs: static-and-unit
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
      - name: UI analyze + widget tests (adaptive shell, flows, storage banner)
        working-directory: packages/ui
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: App analyze + integration tests (real store + gateway behind the UI)
        working-directory: apps/lifeflow_app
        run: |
          flutter pub get
          flutter analyze
          flutter test

  # P01 still adds:
  # - behavioral fitness functions FF-ARCH-06/08/09
  # - golden scenarios
  # - migration + sync tests
  # - Windows + Android builds
