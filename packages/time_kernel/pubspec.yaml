name: time_kernel
description: >-
  Stateless time rules for LifeFlow: ScheduleSpec, RecurrenceRule,
  OccurrenceException, occurrence window query, DST resolution, overlap.
  Pure Dart (ADR-0013). Depends only on foundation + timezone.
publish_to: "none"
version: 0.0.1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  foundation:
    path: ../foundation
  # BSD-2-Clause (LICENSE checked 2026-11-09, ADR-0018). Pinned: the zone
  # database ships inside the package, so an upgrade changes DST data and is
  # a deliberate change (R-DST).
  timezone: 0.11.2

dev_dependencies:
  test: ^1.25.0
  lints: ^5.0.0
