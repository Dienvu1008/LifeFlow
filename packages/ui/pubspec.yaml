name: ui
description: >-
  LifeFlow UI: widgets, view models (Riverpod), router (go_router), adaptive
  shells. Depends on application (via view models), never on infrastructure or
  domain internals (FF-ARCH-04). ADR-0019.
publish_to: "none"
version: 0.0.1
environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.0.0
  foundation:
    path: ../foundation
  application:
    path: ../application
  flutter_localizations:
    sdk: flutter
  intl: 0.20.3 # BSD-3-Clause; P03 UX U1 (dates, plurals)
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
