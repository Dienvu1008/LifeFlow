name: ui
description: >-
  LifeFlow UI: widgets, view models (Riverpod), router (go_router), adaptive
  shells. Depends on application (via view models), never on infrastructure or
  domain internals (FF-ARCH-04). ADR-0019.
publish_to: "none"
version: 0.0.1
environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.0.0
  foundation:
    path: ../foundation
  application:
    path: ../application
  flutter_localizations:
    sdk: flutter
  intl: 0.20.3 # BSD-3-Clause; P03 UX U1 (dates, plurals)
  flutter_sticky_header: 0.11.0 # MIT; P03 UX U4 (sticky day headers, VS-37)
  table_calendar: 3.3.0 # Apache-2.0; P03 UX U4 (month picker, VS-38)
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  # Dogfooding O3 (ADR-0051): bundled fonts, SIL OFL 1.1 (VS-39); never downloaded.
  assets:
    - fonts/Inter/OFL.txt
    - fonts/NotoSans/OFL.txt
    - fonts/BeVietnamPro/OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter/Inter-400.ttf
          weight: 400
        - asset: fonts/Inter/Inter-500.ttf
          weight: 500
        - asset: fonts/Inter/Inter-600.ttf
          weight: 600
        - asset: fonts/Inter/Inter-700.ttf
          weight: 700
    - family: NotoSans
      fonts:
        - asset: fonts/NotoSans/NotoSans-400.ttf
          weight: 400
        - asset: fonts/NotoSans/NotoSans-500.ttf
          weight: 500
        - asset: fonts/NotoSans/NotoSans-600.ttf
          weight: 600
        - asset: fonts/NotoSans/NotoSans-700.ttf
          weight: 700
    - family: BeVietnamPro
      fonts:
        - asset: fonts/BeVietnamPro/BeVietnamPro-400.ttf
          weight: 400
        - asset: fonts/BeVietnamPro/BeVietnamPro-500.ttf
          weight: 500
        - asset: fonts/BeVietnamPro/BeVietnamPro-600.ttf
          weight: 600
        - asset: fonts/BeVietnamPro/BeVietnamPro-700.ttf
          weight: 700
