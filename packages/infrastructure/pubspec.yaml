name: infrastructure
description: >-
  Infrastructure for LifeFlow: Drift database, repositories, outbox/sync,
  platform adapters. Implements ports from domain/application. Scaffold
  skeleton (P01) — empty-but-compiling; the real database (Drift + encryption
  + FTS5, proven by spike S-02) is built in P01. See
  docs/architecture/repository-structure.md.
publish_to: "none"
version: 0.0.1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  foundation:
    path: ../foundation

dev_dependencies:
  test: ^1.25.0
  lints: ^5.0.0
