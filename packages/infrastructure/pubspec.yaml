name: infrastructure
description: >-
  Infrastructure for LifeFlow: Drift database, repositories, outbox/sync,
  platform adapters. Implements ports from domain/application. P01: the local
  Drift store with the governance-ready schema (ADR-0009/0014) and FTS5.
publish_to: "none"
version: 0.0.1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  drift: ^2.28.0
  sqlite3: ^3.5.2
  foundation:
    path: ../foundation
  application:
    path: ../application
  domain:
    path: ../domain
  # Schedules are stored by mapping to and from the Time Kernel types (P02 T3).
  time_kernel:
    path: ../time_kernel
  uuid: ^4.5.0
  # SHA-256 for the export checksum (BSD-3, Dart team).
  crypto: 3.0.8

dev_dependencies:
  test: ^1.25.0
  lints: ^5.0.0
  drift_dev: ^2.28.0
  build_runner: ^2.4.13

# SQLite3MultipleCiphers (MIT, VS-25) instead of plain SQLite, so the headless
# tests exercise real at-rest encryption (ADR-0021, GS-19). Prebuilt binaries
# with pinned hashes are downloaded by the sqlite3 build hook; nothing is
# compiled locally. Without a key sqlite3mc behaves like plain SQLite.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
