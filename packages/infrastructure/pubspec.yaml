name: infrastructure
description: >-
  Infrastructure for LifeFlow: Drift database, repositories, outbox/sync,
  platform adapters. Implements ports from domain/application. P01: the local
  Drift store with the governance-ready schema (ADR-0009/0014) and FTS5.
publish_to: "none"
version: 0.0.1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  drift: ^2.28.0
  sqlite3: ^3.5.2
  foundation:
    path: ../foundation
  application:
    path: ../application
  domain:
    path: ../domain
  # Schedules are stored by mapping to and from the Time Kernel types (P02 T3).
  time_kernel:
    path: ../time_kernel
  uuid: ^4.5.0
  # SHA-256 for the export checksum (BSD-3, Dart team).
  crypto: 3.0.8
  # End-to-end encryption of synced records (Apache-2.0, VS-42; ADR-0052).
  cryptography: 2.9.0
  # P05a T9 (C11, ADR-0074): the .zip export with the documents' files (MIT, VS-48).
  archive: 4.7.1 # P05b T1: pdfrx brings image 4.11, which needs it
  # NFC for sync passphrases, so accents typed either way unlock (MIT, VS-45; ADR-0054).
  unorm_dart: 0.3.3
  # The sync server's REST API (BSD-3, Dart team; already shipped via supabase; ADR-0055).
  http: 1.6.0
  # P05b T2 (ADR-0077): the text of PDFs for search, with PDFium (MIT, VS-49;
  # the same engine and pin as ui's pdfrx 3.0.0, ADR-0075).
  pdfrx_engine: 0.9.3

dev_dependencies:
  test: ^1.25.0
  lints: ^5.0.0
  drift_dev: ^2.28.0
  build_runner: ^2.4.13
  # Tests only: real PDFs with Vietnamese text in an embedded font (Apache-2.0; not shipped).
  pdf: 3.13.1
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
