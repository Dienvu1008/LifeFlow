name: infrastructure
description: >-
  Infrastructure for LifeFlow: Drift database, repositories, outbox/sync,
  platform adapters. Implements ports from domain/application. P01: the local
  Drift store with the governance-ready schema (ADR-0009/0014) and FTS5.
publish_to: "none"
version: 0.0.1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  drift: ^2.28.0
  foundation:
    path: ../foundation

dev_dependencies:
  test: ^1.25.0
  lints: ^5.0.0
  drift_dev: ^2.28.0
  build_runner: ^2.4.13
