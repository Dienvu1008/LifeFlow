name: lifeflow_app
description: >-
  LifeFlow app: the composition root. The only place that wires infrastructure
  into the UI ports (docs/architecture/repository-structure.md).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  ui:
    path: ../../packages/ui
  application:
    path: ../../packages/application
  foundation:
    path: ../../packages/foundation
  infrastructure:
    path: ../../packages/infrastructure
  flutter_riverpod: ^2.6.1
  drift: ^2.28.0
  path_provider: ^2.1.6
  # Database key storage (BSD-3, ADR-0018 OK). Pinned.
  flutter_secure_storage: 11.2.0
  supabase_flutter: 2.18.3
  url_launcher: 6.3.3
  file_picker: 13.3.2
  # Device IANA time zone (Apache-2.0, ADR-0018 OK; spike S-05). Pinned.
  flutter_timezone: 5.1.1
  # Scheduled local notifications for reminders (BSD-3, ADR-0018 OK; spike
  # S-05). 22.3.3, not 23.x: 23 needs compileSdk 37. Pinned.
  flutter_local_notifications: 22.3.3
  # The zone type the plugin schedules with; same pin as time_kernel.
  timezone: 0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # ADR-0035: notices that must travel with the app (shown under
  # Settings > Open-source licenses).
  assets:
    - assets/licenses/desugar_jdk_libs/

# SQLite3MultipleCiphers on every platform (prebuilt, hash-pinned by the
# sqlite3 hook). Encryption is applied only where ADR-0021 requires it
# (Android); Windows MVP opens the same binary without a key = plain.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
