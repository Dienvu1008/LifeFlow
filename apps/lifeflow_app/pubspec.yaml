name: lifeflow_app
description: >-
  LifeFlow app: the composition root. The only place that wires infrastructure
  into the UI ports (docs/architecture/repository-structure.md).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  ui:
    path: ../../packages/ui
  application:
    path: ../../packages/application
  infrastructure:
    path: ../../packages/infrastructure
  flutter_riverpod: ^2.6.1
  drift: ^2.28.0
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
