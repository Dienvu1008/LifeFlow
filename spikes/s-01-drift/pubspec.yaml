name: s01_drift_spike
description: >-
  THROWAWAY proof-of-concept for spike S-01 (Flutter + Drift NativeDatabase on
  Windows and Android with bundled sqlite3 3.x). Not part of the LifeFlow app.
  Do not merge to main as a feature.
publish_to: "none"
version: 0.0.1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Drift ORM + its native (ffi) executor. MIT (VS-26).
  drift: ^2.28.0
  drift_flutter: ^0.2.4 # convenience opener that bundles sqlite3 via build hooks
  path_provider: ^2.1.4
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.28.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
